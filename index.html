<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수학 QR 게임</title>
<meta name="description" content="교과서 QR로 접속해 즐기는 수학 학습 게임 모음">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mesh-bg" aria-hidden="true"></div>

<div id="app">
  <header class="hub-header">
    <h1 class="hub-title">수학 QR 게임</h1>
    <p class="hub-subtitle">교과서 QR로 접속해서, 짧게 즐기며 공식을 익혀요.</p>
  </header>

  <main class="game-list">
    <a class="game-card" href="games/factoring-catcher/">
      <span class="gc-tag">공통수학1 · 다항식</span>
      <span class="gc-title">인수분해 캐처</span>
      <span class="gc-desc">떨어지는 전개식을 보고 알맞은 인수분해 공식 바구니를 탭하는 타임어택 게임</span>
      <span class="gc-play">플레이하기 →</span>
    </a>
  </main>

</html>
